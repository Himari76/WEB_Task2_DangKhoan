
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management System | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<header class="topbar">
    <a class="brand" href="index.html">Management System</a>

    <nav>
        <a href="index.html">Home</a>
        <a class="active nav-login" href="login.html">Login</a>
    </nav>
</header>

<main class="login-main">
    <section class="login-card">

        <div class="logo-mark">M</div>

        <h1>Welcome Back!</h1>

        <p class="muted">
            Log in to continue your journey.
        </p>

        <form id="login-form">
            <h2>Login to your account</h2>

            <p class="form-note">
                Enter your details below to access your account.
            </p>

            <label for="email">Email Address</label>

            <input
                id="email"
                name="email"
                type="email"
                placeholder="name@example.com"
                autocomplete="email"
                required>

            <label for="password">Password</label>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                minlength="4"
                required>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" id="remember" name="remember">
                    Remember me
                </label>

                <a href="#" id="forgot-link">
                    Forgot password?
                </a>
            </div>

            <button class="button submit-button" type="submit">
                Sign In <span>→</span>
            </button>

            <p
                class="form-feedback"
                id="form-feedback"
                aria-live="polite">
            </p>
        </form>

        <p class="signup-note">
            Don't have an account?
            <a href="#" id="signup-link">Sign up</a>
        </p>

        <a class="back-home" href="index.html">
            ← Back to Home
        </a>
    </section>
</main>

<footer>
    <strong>Management System</strong>
    <small>© 2026 Management System. All rights reserved.</small>
</footer>

<script src="script.js"></script>
</body>
</html>
